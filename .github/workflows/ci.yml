name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quebit
          POSTGRES_PASSWORD: quebit
          POSTGRES_DB: quebit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quebit"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in $(ls migrations/*.sql | sort); do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f "$f"
          done
          # Guard against silent schema drift: fail loudly if the columns the
          # tests rely on are missing.
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "SELECT id, idempotency_key, amount, currency, status, attempts, last_error, provider_ref, created_at, updated_at, locked_until, request_hash, published_at FROM payments LIMIT 0;"
        env:
          DATABASE_URL: postgres://quebit:quebit@localhost:5432/quebit?sslmode=disable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -count=1 ./...
        env:
          DATABASE_URL: postgres://quebit:quebit@localhost:5432/quebit?sslmode=disable
