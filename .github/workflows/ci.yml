name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow
          POSTGRES_DB: payflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U payflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Apply migrations
        run: psql "$DATABASE_URL" -f migrations/001_init.sql
        env:
          DATABASE_URL: postgres://payflow:payflow@localhost:5432/payflow?sslmode=disable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -count=1 ./...
        env:
          DATABASE_URL: postgres://payflow:payflow@localhost:5432/payflow?sslmode=disable
